name: Deploy db

on:
  push:
    branches: [master]
    paths:
      - "stacks/db/**"
      - ".github/workflows/deploy-db.yml"
      - ".github/workflows/deploy-stack.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-stack.yml
    with:
      stack: db
    secrets: inherit
