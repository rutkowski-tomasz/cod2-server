name: reverse-proxy Continuous Integration

on:
  push:
    branches: [master]
    paths:
      - 'infra/services/reverse-proxy/**'
      - '.github/workflows/infra-reverse-proxy.yml'
  workflow_dispatch:

env:
  WorkingDir: infra/services/reverse-proxy
  StackName: reverse-proxy

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy ${{ env.StackName }}
        working-directory: ${{ env.WorkingDir}}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          echo "Host *
            StrictHostKeyChecking no" > ~/.ssh/config

          ssh-agent bash -c '
            set -e
            ssh-add ~/.ssh/key
            docker context create temp --docker "host=ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" && docker context use temp

            NGINX_CONF_HASH=$(sha256sum nginx.conf | cut -c1-12) \
              docker stack deploy --resolve-image changed -c compose.yml ${{ env.StackName }}
            docker context rm temp -f
          '
   
          rm -f ~/.ssh/key
