name: Deploy reverse-proxy

on:
  push:
    branches: [master]
    paths:
      - "stacks/reverse-proxy/**"
      - ".github/workflows/deploy-reverse-proxy.yml"
      - ".github/workflows/deploy-stack.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-stack.yml
    with:
      stack: reverse-proxy
    secrets: inherit
