name: Build and Deploy mapview

on:
  push:
    branches: [master]
    paths:
      - "tools/mapview/**"
      - "!tools/mapview/**.md"
      - "tools/shared/**"
      - ".github/workflows/mapview-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cod2-mapview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/mapview/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}

      # The livemap stack pins :latest by digest, so a new image reaches the running service only through an update.
      - name: Update livemap-web
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DOCKER_HOST: ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          printf 'Host *\n  IdentityFile ~/.ssh/key\n  StrictHostKeyChecking no\n' > ~/.ssh/config
          if docker service inspect livemap_livemap-web >/dev/null 2>&1; then
            docker service update --image "$IMAGE:${{ github.sha }}" livemap_livemap-web
          fi
