<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fxview</title>
<style>
  html, body { margin: 0; height: 100%; background: #202020; color: #ddd; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: absolute; left: 0; top: 0; bottom: 0; width: 260px; padding: 8px; box-sizing: border-box; background: rgba(0,0,0,.75); overflow-y: auto; }
  #ui h1 { font-size: 12px; margin: 0 0 6px; word-break: break-all; }
  #ui label { display: block; margin: 2px 0; }
  #ui input[type=range] { width: 100%; }
  #ui select, #ui input[type=number] { background: #333; color: #ddd; border: 1px solid #555; width: 100%; box-sizing: border-box; }
  #ui button { background: #444; color: #ddd; border: 1px solid #666; padding: 2px 8px; margin-right: 4px; }
  #ui .row { display: flex; gap: 4px; align-items: center; margin: 4px 0; }
  #ui .row > * { flex: 1; }
  #elements label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #elements .n { color: #8c8; float: right; }
  #warn { color: #f88; white-space: pre-wrap; }
  #stats { color: #999; }
  #fps { position: absolute; right: 8px; top: 6px; color: #8c8; font: 12px monospace; background: rgba(0,0,0,.5); padding: 2px 6px; }
  canvas { position: absolute; left: 260px; top: 0; }
  .hideui #ui { display: none; }
  .hideui canvas { left: 0; }
</style>
</head>
<body>
<div id="ui">
  <h1 id="title"></h1>
  <div class="row"><button id="play">Pause</button><button id="restart">Restart</button><button id="fit">Fit</button></div>
  <input id="time" type="range" min="0" max="1000" step="1" value="0">
  <div id="stats"></div>
  <div class="row"><label>Speed <select id="speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label>
  <label>Loop <input id="loop" type="checkbox" checked></label></div>
  <div class="row"><label>Forward <select id="forward"><option value="1,0,0">+X (level)</option><option value="0,0,1">+Z (up)</option><option value="0,0,-1">-Z (down)</option><option value="-1,0,0">-X</option></select></label>
  <label>Seed <input id="seed" type="number" value="1" min="0"></label></div>
  <div class="row"><label>Ground <select id="ground"><option value="0">z = 0</option><option value="off">off</option></select></label>
  <label>Background <select id="bg"><option value="0.125">dark</option><option value="0.45">mid</option><option value="0.8">light</option><option value="0">black</option></select></label></div>
  <div class="row"><label><input id="grid" type="checkbox" checked> Grid</label><label><input id="player" type="checkbox" checked> Player ref</label></div>
  <div id="elements"></div>
  <div id="warn"></div>
  <p id="help" style="color:#777">Drag: orbit · Shift+drag: pan · Wheel: zoom · Space: play/pause · ←/→: step 50 ms · H: hide panel</p>
</div>
<canvas id="gl"></canvas>
<div id="fps"></div>
<script id="bundle" type="application/json">__BUNDLE__</script>
<script type="module">
import { createSim, sampleVisual, axisFrom } from './sim.js'

const bundle = JSON.parse(document.getElementById('bundle').textContent)
const params = { ...(bundle.defaults ?? {}), ...Object.fromEntries(new URLSearchParams(location.hash.slice(1))) }
const canvas = document.getElementById('gl')
const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: true, alpha: false })
const $ = (id) => document.getElementById(id)

// ---------- element keys, hidden set ----------
let elementIndex = 0
for (const effect of Object.values(bundle.effects)) for (const def of effect.elements) def.key = `${effect.path.split('/').pop()}:${def.name}#${elementIndex++}`
const hidden = new Set()

// ---------- state ----------
const state = {
  playing: params.t === undefined,
  speed: 1,
  loop: true,
  forward: (params.forward ?? '0,0,1').split(',').map(Number),
  seed: Number(params.seed ?? 1),
  ground: params.ground === 'off' ? null : 0,
  bg: Number(params.bg ?? 0.125),
  grid: params.grid !== 'off',
  player: params.player !== 'off',
}
let sim = makeSim()
const cam = { target: [0, 0, 40], dist: 400, yaw: 35, pitch: 18, fov: 60 }

function makeSim() {
  return createSim(bundle, { seed: state.seed, forward: state.forward, ground: state.ground })
}

// ---------- textures ----------
const textures = {}
const materialMeta = {}
function solidTexture(w, h, fill) {
  const c = document.createElement('canvas')
  c.width = w; c.height = h
  const ctx = c.getContext('2d')
  fill(ctx, w, h)
  return uploadTexture(c)
}
function uploadTexture(src) {
  const tex = gl.createTexture()
  gl.bindTexture(gl.TEXTURE_2D, tex)
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src)
  gl.generateMipmap(gl.TEXTURE_2D)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
  return tex
}
textures.white = solidTexture(2, 2, (ctx, w, h) => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h) })
textures.missing = solidTexture(64, 64, (ctx, w, h) => { ctx.fillStyle = '#f0f'; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w / 2, h / 2); ctx.fillRect(w / 2, h / 2, w / 2, h / 2) })
textures.light = solidTexture(128, 128, (ctx, w, h) => { const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,0.35)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h) })
textures.model = solidTexture(32, 32, (ctx, w, h) => { ctx.fillStyle = '#9a9a9a'; ctx.fillRect(2, 2, w - 4, h - 4); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.strokeRect(3, 3, w - 6, h - 6) })
materialMeta.white = materialMeta.missing = materialMeta.model = { blend: 'blend', atlasCols: 1, atlasRows: 1 }
materialMeta.light = { blend: 'add', atlasCols: 1, atlasRows: 1 }
const textureLoads = Object.entries(bundle.materials).map(([name, m]) => new Promise((resolve) => {
  const img = new Image()
  img.onload = () => { textures[name] = uploadTexture(img); materialMeta[name] = m; resolve() }
  img.onerror = resolve
  img.src = m.png
}))

// ---------- shaders ----------
const program = gl.createProgram()
for (const [type, src] of [[gl.VERTEX_SHADER, `#version 300 es
  in vec3 pos; in vec2 uv; in vec4 col; uniform mat4 vp; out vec2 vUv; out vec4 vCol;
  void main() { gl_Position = vp * vec4(pos, 1.0); vUv = uv; vCol = col; }`],
  [gl.FRAGMENT_SHADER, `#version 300 es
  precision mediump float; in vec2 vUv; in vec4 vCol; uniform sampler2D tex; uniform int mode; out vec4 o;
  void main() {
    vec4 t = texture(tex, vUv) * vCol;
    if (mode == 1) o = vec4(t.rgb * t.a, t.a);          // additive, premultiplied
    else if (mode == 2) o = vec4(mix(vec3(1.0), t.rgb, t.a), 1.0); // multiply
    else o = t;
  }`]]) {
  const sh = gl.createShader(type)
  gl.shaderSource(sh, src)
  gl.compileShader(sh)
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh))
  gl.attachShader(program, sh)
}
gl.linkProgram(program)
gl.useProgram(program)
const uVp = gl.getUniformLocation(program, 'vp')
const uMode = gl.getUniformLocation(program, 'mode')
const vbo = gl.createBuffer()
const ibo = gl.createBuffer()
const vao = gl.createVertexArray()
gl.bindVertexArray(vao)
gl.bindBuffer(gl.ARRAY_BUFFER, vbo)
const STRIDE = 9 * 4
for (const [i, size, offset] of [[0, 3, 0], [1, 2, 12], [2, 4, 20]]) { gl.enableVertexAttribArray(i); gl.vertexAttribPointer(i, size, gl.FLOAT, false, STRIDE, offset) }
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo)
let verts = new Float32Array(9 * 4 * 4096)
let indices = new Uint32Array(6 * 4096)
function ensureCapacity(quads) {
  if (indices.length >= quads * 6) return
  verts = new Float32Array(9 * 4 * quads)
  indices = new Uint32Array(6 * quads)
}
function fillIndices(quads) {
  for (let q = 0; q < quads; q++) { const v = q * 4, i = q * 6; indices[i] = v; indices[i + 1] = v + 1; indices[i + 2] = v + 2; indices[i + 3] = v; indices[i + 4] = v + 2; indices[i + 5] = v + 3 }
}

// ---------- math ----------
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: (a) => Math.hypot(a[0], a[1], a[2]),
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l] },
}
function perspective(fovDeg, aspect, near, far) {
  const f = 1 / Math.tan((fovDeg * Math.PI) / 360)
  return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, (2 * far * near) / (near - far), 0]
}
function lookAt(eye, target, up) {
  const z = V.norm(V.sub(eye, target))
  const x = V.norm(V.cross(up, z))
  const y = V.cross(z, x)
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -V.dot(x, eye), -V.dot(y, eye), -V.dot(z, eye), 1]
}
function mat4mul(a, b) {
  const o = new Array(16)
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3]
  return o
}
function cameraEye() {
  const yaw = (cam.yaw * Math.PI) / 180
  const pitch = (cam.pitch * Math.PI) / 180
  return V.add(cam.target, [Math.cos(pitch) * Math.cos(yaw) * cam.dist, Math.cos(pitch) * Math.sin(yaw) * cam.dist, Math.sin(pitch) * cam.dist])
}

// ---------- drawing ----------
const lineQuads = []
function pushLine(a, b, color, width = 1) {
  lineQuads.push({ a, b, color, width })
}
function sceneLines() {
  lineQuads.length = 0
  const eye = cameraEye()
  if (state.grid && state.ground !== null) {
    const z = state.ground
    for (let i = -16; i <= 16; i++) {
      const g = state.bg + 0.12
      const c = i === 0 ? [g + 0.4, g + 0.4, g + 0.4, 1] : i % 4 === 0 ? [g + 0.2, g + 0.2, g + 0.2, 1] : [g + 0.08, g + 0.08, g + 0.08, 1]
      // Short segments keep the screen-space width right when a line passes close to the camera.
      for (let k = -16; k < 16; k++) {
        pushLine([i * 64, k * 64, z + 0.2], [i * 64, (k + 1) * 64, z + 0.2], c)
        pushLine([k * 64, i * 64, z + 0.2], [(k + 1) * 64, i * 64, z + 0.2], c)
      }
    }
  }
  const axis = axisFrom(state.forward, Math.abs(state.forward[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1])
  pushLine([0, 0, 0], V.mul(axis[0], 48), [1, 0.3, 0.3, 1], 2)
  pushLine([0, 0, 0], V.mul(axis[1], 32), [0.3, 1, 0.3, 1], 2)
  pushLine([0, 0, 0], V.mul(axis[2], 32), [0.4, 0.5, 1, 1], 2)
  if (state.player) {
    // 72-unit player silhouette, 30 wide, standing 120 units to the left as a scale reference.
    const z = state.ground ?? 0
    const toEye = V.norm(V.sub(eye, [0, 120, z + 36]))
    const side = V.norm(V.cross([0, 0, 1], toEye))
    const c = [0.55, 0.55, 0.6, 1]
    const p = (s, h) => V.add([0, 120, z + h], V.mul(side, s))
    pushLine(p(-15, 0), p(15, 0), c); pushLine(p(15, 0), p(15, 72), c); pushLine(p(15, 72), p(-15, 72), c); pushLine(p(-15, 72), p(-15, 0), c)
    pushLine(p(-15, 60), p(15, 60), c)
  }
}

function render() {
  const eye = cameraEye()
  const aspect = canvas.width / canvas.height
  const vp = mat4mul(perspective(cam.fov, aspect, 2, 20000), lookAt(eye, cam.target, [0, 0, 1]))
  const viewFwd = V.norm(V.sub(cam.target, eye))
  const viewRight = V.norm(V.cross(viewFwd, [0, 0, 1]))
  const viewUp = V.cross(viewRight, viewFwd)
  gl.viewport(0, 0, canvas.width, canvas.height)
  gl.clearColor(state.bg, state.bg, state.bg, 1)
  gl.depthMask(true)
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT)
  gl.enable(gl.DEPTH_TEST)
  gl.enable(gl.BLEND)
  gl.uniformMatrix4fv(uVp, false, vp)

  // Reference lines, with depth write so particles sort against the ground.
  sceneLines()
  gl.depthMask(true)
  // Screen-constant line width: each end is widened in proportion to its distance from the eye.
  const lq = lineQuads.map((l) => {
    const d = V.sub(l.b, l.a)
    const dir = V.norm(V.cross(d, V.sub(eye, l.a)))
    const sideA = V.mul(dir, l.width * 0.0012 * V.len(V.sub(eye, l.a)))
    const sideB = V.mul(dir, l.width * 0.0012 * V.len(V.sub(eye, l.b)))
    return { corners: [V.add(l.a, sideA), V.add(l.b, sideB), V.sub(l.b, sideB), V.sub(l.a, sideA)], color: l.color, tex: 'white', frame: 0 }
  })
  drawQuads(lq)
  gl.depthMask(false)

  // Particles, far to near, batched by material.
  const items = []
  const now = sim.time
  for (const p of sim.particles) {
    if (p.spawnTime > now || hidden.has(p.def.key)) continue
    if (state.ground !== null && p.pos[2] < state.ground - 2 && p.type !== 'Decal') continue
    const q = particleQuad(p, eye, viewRight, viewUp)
    if (q) { q.depth = V.dot(V.sub(p.pos, eye), viewFwd); items.push(q) }
  }
  items.sort((a, b) => b.depth - a.depth)
  drawQuads(items)
}

function particleQuad(p, eye, viewRight, viewUp) {
  const vis = sampleVisual(p)
  const d = p.def
  let tex = p.shader ?? 'missing'
  if (p.shader && !textures[p.shader]) tex = 'missing'
  const color = [vis.rgb[0], vis.rgb[1], vis.rgb[2], vis.alpha]
  const w = vis.width, h = vis.height
  if (w <= 0 && d.type !== 'Light') return null
  const rot = (vis.rotation * Math.PI) / 180
  let right, up, center = p.pos
  switch (d.type) {
    case 'Particle':
    case 'Cloud': {
      const c = Math.cos(rot), s = Math.sin(rot)
      right = V.add(V.mul(viewRight, c), V.mul(viewUp, s))
      up = V.sub(V.mul(viewUp, c), V.mul(viewRight, s))
      return quad(center, V.mul(right, w / 2), V.mul(up, h / 2), color, tex, vis.frame)
    }
    case 'Tail': {
      let dir = V.sub(p.pos, p.last)
      if (V.len(dir) < 1e-4) dir = p.vel && V.len(p.vel) > 1e-4 ? p.vel : p.axis[0]
      dir = V.norm(dir)
      const toEye = V.sub(eye, p.pos)
      let side = V.cross(dir, toEye)
      if (V.len(side) < 1e-4) side = viewRight
      side = V.norm(side)
      const len = Math.max(vis.length, w * 0.5)
      center = V.sub(p.pos, V.mul(dir, len / 2))
      return quad(center, V.mul(side, w / 2), V.mul(dir, len / 2), color, tex, vis.frame)
    }
    case 'OrientedParticle':
    case 'Decal': {
      const c = Math.cos(rot), s = Math.sin(rot)
      const l = p.effectAxis[1], u = p.effectAxis[2]
      right = V.add(V.mul(l, c), V.mul(u, s))
      up = V.sub(V.mul(u, c), V.mul(l, s))
      if (d.type === 'Decal') center = V.add(p.pos, V.mul(p.effectAxis[0], 0.4))
      return quad(center, V.mul(right, w / 2), V.mul(up, h / 2), color, tex, vis.frame)
    }
    case 'Light': {
      const r = Math.max(8, w)
      return quad(center, V.mul(viewRight, r / 2), V.mul(viewUp, r / 2), [color[0], color[1], color[2], color[3] * 0.35], 'light', 0)
    }
    case 'Emitter': {
      const size = d.flags.includes('useModel') ? 10 * Math.max(0.2, w) : 4
      return quad(center, V.mul(viewRight, size / 2), V.mul(viewUp, size / 2), d.flags.includes('useModel') ? [0.8, 0.8, 0.8, 1] : [1, 1, 0, 0.6], 'model', 0)
    }
  }
  return null
}

function quad(center, r, u, color, tex, frame) {
  return { corners: [V.sub(V.sub(center, r), u), V.sub(V.add(center, r), u), V.add(V.add(center, r), u), V.add(V.sub(center, r), u)], color, tex, frame }
}

const MODES = { blend: 0, add: 1, multiply: 2 }
function drawQuads(items) {
  if (!items.length) return
  ensureCapacity(items.length)
  let n = 0
  let batchTex = null
  let batchStart = 0
  const flush = (end) => {
    if (end === batchStart) return
    const meta = materialMeta[batchTex]
    const mode = MODES[meta.blend] ?? 0
    if (mode === 1) gl.blendFunc(gl.ONE, gl.ONE)
    else if (mode === 2) gl.blendFunc(gl.DST_COLOR, gl.ZERO)
    else gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA)
    gl.uniform1i(uMode, mode)
    gl.bindTexture(gl.TEXTURE_2D, textures[batchTex])
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo)
    gl.bufferData(gl.ARRAY_BUFFER, verts.subarray(batchStart * 36, end * 36), gl.STREAM_DRAW)
    fillIndices(end - batchStart)
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo)
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices.subarray(0, (end - batchStart) * 6), gl.STREAM_DRAW)
    gl.drawElements(gl.TRIANGLES, (end - batchStart) * 6, gl.UNSIGNED_INT, 0)
    batchStart = end
  }
  for (const it of items) {
    if (it.tex !== batchTex) { flush(n); batchTex = it.tex }
    const meta = materialMeta[it.tex]
    const cols = meta.atlasCols, rows = meta.atlasRows
    const fx = it.frame % cols, fy = Math.floor(it.frame / cols) % rows
    const uvs = [[fx / cols, (fy + 1) / rows], [(fx + 1) / cols, (fy + 1) / rows], [(fx + 1) / cols, fy / rows], [fx / cols, fy / rows]]
    for (let k = 0; k < 4; k++) {
      const o = (n * 4 + k) * 9
      verts[o] = it.corners[k][0]; verts[o + 1] = it.corners[k][1]; verts[o + 2] = it.corners[k][2]
      verts[o + 3] = uvs[k][0]; verts[o + 4] = uvs[k][1]
      verts[o + 5] = it.color[0]; verts[o + 6] = it.color[1]; verts[o + 7] = it.color[2]; verts[o + 8] = it.color[3]
    }
    n++
  }
  flush(n)
}

// ---------- camera fit ----------
// Frames the bulk of the effect: a few stray particles flying far away must not shrink everything else.
function fit() {
  const b = sim.bounds()
  cam.target = b.center
  const radius = Math.max(64, b.radius)
  cam.dist = (radius / Math.tan((cam.fov * Math.PI) / 360)) * 1.15
}

// ---------- UI ----------
function buildElementList() {
  const box = $('elements')
  box.innerHTML = ''
  for (const effect of Object.values(bundle.effects)) {
    const h = document.createElement('div')
    h.style.color = '#aaa'
    h.style.marginTop = '6px'
    h.textContent = effect.path
    box.appendChild(h)
    for (const def of effect.elements) {
      const label = document.createElement('label')
      const cb = document.createElement('input')
      cb.type = 'checkbox'
      cb.checked = !hidden.has(def.key)
      cb.onchange = () => { cb.checked ? hidden.delete(def.key) : hidden.add(def.key) }
      label.appendChild(cb)
      label.appendChild(document.createTextNode(` ${def.type} ${def.name} `))
      const n = document.createElement('span')
      n.className = 'n'
      n.dataset.key = def.key
      label.appendChild(n)
      label.title = `${def.type} ${def.name}\nshaders: ${def.shaders.join(', ') || '-'}\nmodels: ${def.models.join(', ') || '-'}\nlife ${def.life} delay ${def.delay} count ${def.count}\nflags: ${def.flags.join(' ')}\nspawn: ${def.spawnFlags.join(' ')}`
      box.appendChild(label)
    }
  }
}
function updateUi() {
  $('time').max = Math.ceil(sim.activeDuration)
  $('time').value = Math.min(sim.time, sim.activeDuration)
  const live = sim.particles.filter((p) => p.spawnTime <= sim.time).length
  $('stats').textContent = `t = ${Math.round(sim.time)} ms / ${Math.round(sim.activeDuration)} ms (full ${Math.round(sim.duration)}) · ${live} particles · ${sim.instances} effect instances${sim.dropped ? ` · ${sim.dropped} dropped` : ''}`
  const counts = {}
  for (const p of sim.particles) if (p.spawnTime <= sim.time) counts[p.def.key] = (counts[p.def.key] ?? 0) + 1
  for (const n of document.querySelectorAll('#elements .n')) n.textContent = counts[n.dataset.key] ?? ''
  const warn = [...sim.warnings]
  if (bundle.missing.materials.length) warn.push(`missing materials: ${bundle.missing.materials.join(', ')}`)
  if (bundle.missing.images.length) warn.push(`missing images: ${bundle.missing.images.join(', ')}`)
  if (bundle.missing.effects.length) warn.push(`missing effects: ${bundle.missing.effects.join(', ')}`)
  if (bundle.missing.models.length) warn.push(`models drawn as gray boxes: ${bundle.missing.models.join(', ')}`)
  $('warn').textContent = warn.join('\n')
}
$('title').textContent = bundle.root
$('play').onclick = () => { state.playing = !state.playing; $('play').textContent = state.playing ? 'Pause' : 'Play' }
$('restart').onclick = () => { sim.reset() }
$('fit').onclick = fit
$('time').oninput = (e) => { state.playing = false; $('play').textContent = 'Play'; sim.seek(Number(e.target.value)) }
$('speed').onchange = (e) => { state.speed = Number(e.target.value) }
$('loop').onchange = (e) => { state.loop = e.target.checked }
$('forward').value = state.forward.join(',')
$('forward').onchange = (e) => { state.forward = e.target.value.split(',').map(Number); sim = makeSim(); fit() }
$('seed').value = state.seed
$('seed').onchange = (e) => { state.seed = Number(e.target.value); sim = makeSim() }
$('ground').value = state.ground === null ? 'off' : '0'
$('ground').onchange = (e) => { state.ground = e.target.value === 'off' ? null : 0; sim = makeSim() }
$('bg').value = String(state.bg)
$('bg').onchange = (e) => { state.bg = Number(e.target.value) }
$('grid').checked = state.grid
$('grid').onchange = (e) => { state.grid = e.target.checked }
$('player').checked = state.player
$('player').onchange = (e) => { state.player = e.target.checked }
buildElementList()

let drag = null
canvas.onmousedown = (e) => { drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey } }
window.onmouseup = () => { drag = null }
window.onmousemove = (e) => {
  if (!drag) return
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y
  drag.x = e.clientX; drag.y = e.clientY
  if (drag.pan) {
    const eye = cameraEye()
    const fwd = V.norm(V.sub(cam.target, eye))
    const right = V.norm(V.cross(fwd, [0, 0, 1]))
    const up = V.cross(right, fwd)
    const k = cam.dist * 0.0015
    cam.target = V.add(cam.target, V.add(V.mul(right, -dx * k), V.mul(up, dy * k)))
  } else {
    cam.yaw -= dx * 0.4
    cam.pitch = Math.max(-89, Math.min(89, cam.pitch + dy * 0.4))
  }
}
canvas.onwheel = (e) => { cam.dist = Math.max(10, Math.min(20000, cam.dist * Math.exp(e.deltaY * 0.001))); e.preventDefault() }
window.onkeydown = (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return
  if (e.code === 'Space') { $('play').click(); e.preventDefault() }
  if (e.code === 'ArrowRight') { state.playing = false; sim.seek(sim.time + 50) }
  if (e.code === 'ArrowLeft') { state.playing = false; sim.seek(Math.max(0, sim.time - 50)) }
  if (e.key === 'h') document.body.classList.toggle('hideui')
}

function resize() {
  const uiWidth = document.body.classList.contains('hideui') ? 0 : 260
  canvas.width = Math.max(1, window.innerWidth - uiWidth)
  canvas.height = Math.max(1, window.innerHeight)
}
window.onresize = resize

// ---------- loop ----------
let last = performance.now()
let fpsAcc = 0
let fpsFrames = 0
function frame(now) {
  const dt = Math.min(100, now - last)
  fpsAcc += now - last
  fpsFrames++
  if (fpsAcc >= 500) { $('fps').textContent = `${Math.round((fpsFrames * 1000) / fpsAcc)} fps`; fpsAcc = 0; fpsFrames = 0 }
  last = now
  if (state.playing) {
    const t = sim.time + dt * state.speed
    if (t > sim.activeDuration + 400) { if (state.loop) sim.reset(); else state.playing = false }
    else sim.seek(t)
  }
  render()
  updateUi()
  requestAnimationFrame(frame)
}

// ---------- headless API ----------
// Renders the given times into one labelled contact sheet and returns it as a PNG data URL.
window.efx = {
  sim: () => sim,
  hidden,
  state,
  cam,
  seek: (t) => { sim.seek(t); render(); updateUi() },
  fit,
  setCamera: ({ yaw, pitch, dist, target }) => { if (yaw !== undefined) cam.yaw = yaw; if (pitch !== undefined) cam.pitch = pitch; if (dist !== undefined) cam.dist = dist; if (target) cam.target = target },
  counts: () => sim.counts(),
  info: () => ({ duration: sim.duration, activeDuration: sim.activeDuration, bounds: sim.bounds(), warnings: [...sim.warnings], missing: bundle.missing, instances: sim.instances }),
  capture: ({ times, cols = 4, width = 480, height = 360 }) => {
    state.playing = false
    document.body.classList.add('hideui')
    canvas.width = width
    canvas.height = height
    const rows = Math.ceil(times.length / cols)
    const sheet = document.createElement('canvas')
    sheet.width = cols * width
    sheet.height = rows * height
    const ctx = sheet.getContext('2d')
    const frames = []
    times.forEach((t, i) => {
      sim.seek(t)
      render()
      const x = (i % cols) * width, y = Math.floor(i / cols) * height
      ctx.drawImage(canvas, x, y)
      ctx.fillStyle = 'rgba(0,0,0,0.6)'
      ctx.fillRect(x, y, 110, 18)
      ctx.fillStyle = '#fff'
      ctx.font = '13px monospace'
      ctx.fillText(`t = ${Math.round(t)} ms`, x + 4, y + 13)
      ctx.strokeStyle = '#000'
      ctx.strokeRect(x + 0.5, y + 0.5, width - 1, height - 1)
      frames.push({ t, counts: sim.counts() })
    })
    document.body.classList.remove('hideui')
    resize()
    return { png: sheet.toDataURL('image/png'), frames }
  },
}

Promise.all(textureLoads).then(() => {
  resize()
  if (params.cam) { const [yaw, pitch, dist] = params.cam.split(',').map(Number); Object.assign(cam, { yaw, pitch, dist }) } else fit()
  if (params.t !== undefined) sim.seek(Number(params.t))
  window.efxReady = true
  requestAnimationFrame(frame)
})
</script>
</body>
</html>
