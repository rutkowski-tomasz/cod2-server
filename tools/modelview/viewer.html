<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>modelview</title>
<style>
  html, body { margin: 0; height: 100%; background: #202020; color: #ddd; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: absolute; left: 0; top: 0; bottom: 0; width: 260px; padding: 8px; box-sizing: border-box; background: rgba(0,0,0,.75); overflow-y: auto; }
  #ui h1 { font-size: 12px; margin: 0 0 6px; word-break: break-all; }
  #ui label { display: block; margin: 2px 0; }
  #ui input[type=range] { width: 100%; }
  #ui select { background: #333; color: #ddd; border: 1px solid #555; width: 100%; box-sizing: border-box; }
  #ui button { background: #444; color: #ddd; border: 1px solid #666; padding: 2px 8px; }
  #ui .row { display: flex; gap: 4px; align-items: center; margin: 4px 0; }
  #ui .row > * { flex: 1; }
  #warn { color: #f88; white-space: pre-wrap; }
  #stats { color: #999; white-space: pre-wrap; }
  #fps { position: absolute; right: 8px; top: 6px; color: #8c8; font: 12px monospace; background: rgba(0,0,0,.5); padding: 2px 6px; }
  #labels div { position: absolute; transform: translate(4px, -50%); color: #ffd166; font: 11px monospace; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: nowrap; pointer-events: none; }
  #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.7); padding: 10px 14px; border-radius: 4px; }
  canvas, #labels { position: absolute; left: 260px; top: 0; }
  .hideui #ui { display: none; }
  .hideui canvas, .hideui #labels { left: 0; }
</style>
</head>
<body>
<div id="ui">
  <h1 id="title"></h1>
  <div class="row" id="viewRow"><label>View <select id="view"></select></label></div>
  <div class="row"><label>Animation <select id="anim"></select></label></div>
  <div class="row"><button id="play">Pause</button><button id="fit">Fit</button></div>
  <input id="time" type="range" min="0" max="1000" step="1" value="0">
  <div class="row"><label>Speed <select id="speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label>
  <label>Background <select id="bg"><option>dark</option><option>mid</option><option>light</option><option>black</option></select></label></div>
  <div class="row"><label><input id="tex" type="checkbox" checked> Textures</label><label><input id="wire" type="checkbox"> Wireframe</label></div>
  <div class="row"><label><input id="bones" type="checkbox"> Bones</label><label><input id="grid" type="checkbox" checked> Grid</label></div>
  <div class="row" id="eyeRow"><label title="See it from the eye, with cg_fov 80, as the game draws it"><input id="eye" type="checkbox"> Eye view</label></div>
  <div id="stats"></div>
  <div id="warn"></div>
  <p style="color:#777">Drag: orbit · Shift+drag: pan · Wheel: zoom · Space: play/pause · ←/→: step a frame · H: hide panel</p>
</div>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="fps"></div>
<div id="status">loading…</div>
<script id="three" type="text/plain">__THREE__</script>
<script id="bundle" type="application/json">__BUNDLE__</script>
<script>
// Uncaught errors end the wait in `render` and show on the page.
addEventListener('error', (e) => {
  window.modelError = e.message
  Object.assign(document.getElementById('status'), { textContent: e.message }).style.display = 'block'
})
</script>
<script type="module">
// The modules below use this THREE.
const THREE = await import(document.getElementById('three').textContent)
__SCRIPT__
</script>
</body>
</html>
